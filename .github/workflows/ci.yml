name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit tests + golden
        run: cargo test --release

  ibus:
    name: rustype-linux sandbox (IBus, GNOME)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install IBus, D-Bus and gdbus
        run: sudo apt-get update && sudo apt-get install -y ibus dbus dbus-x11 libglib2.0-bin python3-gi gir1.2-ibus-1.0

      - name: Build
        run: cargo build --release --locked -p rustype-linux

      - name: rustype-linux sandbox test
        run: tools/rustype_linux_sandbox.sh "$PWD/target/release/rustype-linux"

  package:
    name: Test Packaging (.deb)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev gzip

      - name: Build Debian package
        run: |
          chmod +x packaging/build-deb.sh
          ./packaging/build-deb.sh

      - name: Verify package structure
        run: |
          dpkg-deb -I target/packages/*.deb
          dpkg-deb -c target/packages/*.deb > contents.txt
          grep -q ' \./usr/libexec/rustype-linux$' contents.txt
          grep -q ' \./usr/lib/systemd/user/org.freedesktop.IBus.session.GNOME.service.d/rustype.conf$' contents.txt
          if grep -q 'ibus-engine-rustype\|rustype\.xml' contents.txt; then
            echo "FAIL: the package still ships the old IBus component"; exit 1
          fi

  integration:
    name: Integration tests (install.sh, .deb, maintainer scripts)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev python3

      - name: Build rustype-linux
        run: cargo build --release --locked -p rustype-linux

      - name: Run integration suite
        run: tests/run_all.sh
        env:
          RUSTYPE_LINUX_BIN: ${{ github.workspace }}/target/release/rustype-linux

  windows:
    name: Windows Build & Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check Windows components
        run: cargo check -p rustype-core -p rustype-windows
      - name: Test Core on Windows
        run: cargo test -p rustype-core

  macos:
    name: macOS Build & Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Core on macOS
        run: cargo test -p rustype-core
      - name: Build macOS InputMethodKit Bundle
        run: |
          chmod +x rustype-macos/build-macos.sh
          ./rustype-macos/build-macos.sh
