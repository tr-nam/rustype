name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit tests + golden
        run: cargo test --release

  ibus:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install IBus
        run: sudo apt-get update && sudo apt-get install -y ibus dbus-x11 python3-gi gir1.2-ibus-1.0

      - name: Build
        run: cargo build --release

      - name: IBus sandbox test
        run: |
          target/release/ibus-engine-rustype --xml > /tmp/rustype.xml
          tools/ibus_sandbox_test.sh "$PWD/target/release/ibus-engine-rustype" /tmp/rustype.xml rustype
