name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Phiên bản phát hành (ví dụ: v0.1.0)'
        required: true
        default: 'v0.1.0'
      draft:
        description: 'Tạo bản nháp (Draft)?'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Đánh dấu là bản thử nghiệm (Pre-release)?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Package Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version & Tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Using Tag: ${TAG}, Version: ${VERSION}"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install build & packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev gzip

      - name: Build Debian (.deb) package
        run: |
          chmod +x packaging/build-deb.sh
          ./packaging/build-deb.sh

      - name: Package Standalone Tarball
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          VERSION="${{ steps.meta.outputs.version }}"
          TAR_NAME="rustype-${TAG}-linux-x86_64.tar.gz"
          STAGING="target/tar-staging/rustype-${VERSION}"
          rm -rf "target/tar-staging"
          mkdir -p "$STAGING" "target/packages"
          cp target/release/ibus-engine-rustype "$STAGING/"
          cp -r tools assets gnome-shell-extension install.sh uninstall.sh Makefile LICENSE README.md docs "$STAGING/"
          tar -czvf "target/packages/$TAR_NAME" -C target/tar-staging "rustype-${VERSION}"

      - name: Compute SHA256 Checksums
        run: |
          cd target/packages
          rm -f SHA256SUMS
          sha256sum *.deb *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Rustype ${{ steps.meta.outputs.tag }}
          files: |
            target/packages/*.deb
            target/packages/*.tar.gz
            target/packages/SHA256SUMS
          generate_release_notes: true
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
