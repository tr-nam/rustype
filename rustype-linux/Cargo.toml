[package]
name = "rustype-linux"
version = "0.1.1"
edition = "2021"
description = "Rustype's IBus-protocol bus for GNOME, with the Vietnamese engine in-process"
license = "MIT"
publish = false

[lib]
name = "rustype_linux"
path = "src/lib.rs"

[[bin]]
name = "rustype-linux"
path = "src/main.rs"

[dependencies]
rustype-core = { path = "../rustype-core" }
