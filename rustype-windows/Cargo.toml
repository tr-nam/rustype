[package]
name = "rustype-windows"
version = "0.1.0"
edition = "2021"
description = "Lightweight Vietnamese input method for Windows (EVKey/Unikey architecture)"
license = "MIT"
publish = false

[dependencies]
rustype-core = { path = "../rustype-core" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }
