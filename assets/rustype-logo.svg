<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="100%" height="100%">
  <defs>
    <!-- Ambient Drop Shadow -->
    <filter id="drop-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0a0502" flood-opacity="0.32" />
    </filter>
    <filter id="top-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#552200" flood-opacity="0.18" />
    </filter>

    <!-- Base Gradients -->
    <linearGradient id="base-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b2b" />
      <stop offset="60%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#b43403" />
    </linearGradient>
    <linearGradient id="base-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff893d" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>

    <!-- Cream Top Face Gradients -->
    <linearGradient id="top-face" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#fcf8f2" />
      <stop offset="100%" stop-color="#f2e8da" />
    </linearGradient>
    <linearGradient id="top-bevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#decaba" stop-opacity="0.6" />
    </linearGradient>

    <!-- Spark Gradient -->
    <linearGradient id="spark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff893b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>

  <!-- Embed Keycap Icon on the Left -->
  <g transform="translate(40, -10) scale(0.85)">
    <g transform="translate(0, -6)">
    <!-- Base Body Outer Path (with shadow) -->
    <path filter="url(#drop-shadow)"
          d="M 235 56
             C 246 51, 266 51, 277 56
             L 438 152
             C 458 164, 466 182, 458 206
             L 426 342
             C 420 366, 400 384, 376 394
             L 272 436
             C 260 441, 244 441, 232 436
             L 98 376
             C 76 366, 60 348, 54 326
             L 50 200
             C 46 178, 58 158, 78 146
             Z"
          fill="url(#base-left)" />

    <!-- Right Face Shading Overlay -->
    <path d="M 256 70
             L 438 152
             C 458 164, 466 182, 458 206
             L 426 342
             C 420 366, 400 384, 376 394
             L 256 438
             L 256 70 Z"
          fill="url(#base-right)" opacity="0.95" />

    <!-- Corner highlight bevel on base -->
    <path d="M 254 70 L 254 438 L 258 438 L 258 70 Z" fill="#ffffff" opacity="0.15" />

    <!-- Inner Cream Cap Cushion / Bevel Rim -->
    <path d="M 238 88
             C 248 83, 264 83, 274 88
             L 414 168
             C 428 176, 432 190, 426 206
             L 398 316
             C 392 332, 378 344, 360 352
             L 270 388
             C 260 392, 246 392, 236 388
             L 124 338
             C 108 330, 96 318, 92 302
             L 88 198
             C 86 182, 94 170, 108 162
             Z"
          fill="url(#top-bevel)" />

    <!-- Top Cream Face Surface -->
    <path filter="url(#top-shadow)"
          d="M 238 94
             C 248 89, 264 89, 274 94
             L 410 172
             C 422 179, 426 191, 420 205
             L 392 312
             C 386 326, 374 336, 358 344
             L 270 382
             C 260 386, 246 386, 236 382
             L 128 334
             C 114 327, 104 317, 100 303
             L 94 202
             C 92 188, 98 178, 110 171
             Z"
          fill="url(#top-face)" />

    <!-- Top Face Subtle Gloss Line -->
    <path d="M 240 98 L 406 174" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.75" />

    <!-- Central Letter 'R' (Isometric Projection) -->
    <g transform="matrix(0.96 0.28 -0.32 0.92 120 40)">
      <path d="M 172 135
               L 204 135
               C 228 135, 244 146, 244 166
               C 244 182, 232 193, 216 197
               L 248 238
               L 226 238
               L 197 200
               L 189 200
               L 189 238
               L 172 238
               Z
               M 189 187
               L 202 187
               C 216 187, 226 180, 226 167
               C 226 153, 216 148, 202 148
               L 189 148
               Z"
            fill="#1e242c" />
    </g>

    <!-- 3 Radiating Accent Marks / Typing Sparks -->
    <!-- Top-left spark -->
    <path d="M 326 100 L 334 82 C 336 78, 342 77, 345 80 L 350 84 C 353 87, 353 92, 349 95 L 337 106 C 334 109, 329 108, 327 104 Z"
          fill="url(#spark-grad)" />

    <!-- Middle spark -->
    <path d="M 344 120 L 366 112 C 370 110, 375 113, 376 117 L 377 122 C 378 127, 375 131, 371 132 L 349 135 C 344 136, 340 132, 341 127 Z"
          fill="url(#spark-grad)" />

    <!-- Bottom spark -->
    <path d="M 342 144 L 358 147 C 363 148, 366 153, 365 157 L 364 161 C 362 165, 357 167, 353 166 L 339 158 C 335 156, 334 150, 338 146 Z"
          fill="url(#spark-grad)" />
  </g>
  </g>

  <!-- Wordmark and Tagline on the Right -->
  <g transform="translate(430, 205)">
    <!-- "Rustype" Text -->
    <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, sans-serif"
          font-size="124"
          font-weight="900"
          letter-spacing="-2">
      <tspan fill="#1e242c">Rus</tspan><tspan fill="#f97316">type</tspan>
    </text>

    <!-- Tagline: "Gõ tiếng Việt • Cùng Rust" -->
    <text y="70"
          x="8"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, sans-serif"
          font-size="34"
          font-weight="600"
          letter-spacing="2.5"
          fill="#64748b">
      Gõ tiếng Việt  •  Cùng Rust
    </text>
  </g>
</svg>
