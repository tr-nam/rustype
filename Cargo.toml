[package]
name = "rustype"
version = "0.1.0"
edition = "2021"
description = "Bộ gõ tiếng Việt Telex siêu nhẹ cho IBus, không phụ thuộc thư viện ngoài"
license = "MIT"
publish = false

[dependencies]

[[bin]]
name = "ibus-engine-rustype"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
